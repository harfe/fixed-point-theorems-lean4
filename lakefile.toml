name = "fixed-point-theorems"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["FixedPointTheorems"]
fixedToolchain = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "FixedPointTheorems"
