name = "fixed-point-theorems"
version = "4.35.0"
keywords = ["math"]
defaultTargets = ["FixedPointTheorems"]
fixedToolchain = true
# Keep ordinary Lean imports while consuming module-system dependencies.
allowNonModules = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "FixedPointTheorems"
